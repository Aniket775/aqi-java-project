server.port=${PORT:8080}
spring.application.name=AQI Monitoring & Prediction System

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aqi_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.bigcoders.aqi=INFO
logging.level.org.springframework.security=WARN

# Session Management
server.servlet.session.timeout=30m

# Open-Meteo Weather API (Free, no key required)
openmeteo.api.base-url=https://api.open-meteo.com/v1/forecast

# OpenAQ API (Optional Live AQI)
openaq.api.key=${OPENAQ_API_KEY:}
openaq.api.base-url=https://api.openaq.org/v3
