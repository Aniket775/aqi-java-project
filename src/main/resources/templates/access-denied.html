<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="page" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="glass-card" style="text-align: center; max-width: 480px; padding: 48px 36px;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--terracotta-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px auto; color: var(--terracotta);">
            <!-- Gentle Lock / Protective Nature SVG -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 style="font-size: 1.8rem; font-weight: 600; margin-bottom: 8px;">Restricted Jurisdiction (403)</h1>
        <p style="color: var(--text-earth); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px;">
            Your current account credentials do not hold clearance for this operational or administrative resource.
        </p>
        <a th:href="@{/}" class="btn btn-primary">Return to Atmospheric Dashboard</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
