<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AQI Sentinel | The Air You Breathe</title>

    <!-- Botanical Leaf SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232F4A3A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/><path d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12'/></svg>">

    <!-- Google Fonts: Fraunces, DM Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            position: relative;
            background: linear-gradient(180deg, #DCEEFB 0%, #E8F5E9 45%, var(--bg-canvas) 100%);
            overflow: hidden;
        }

        [data-theme="dark"] .login-wrapper {
            background: linear-gradient(180deg, #121E24 0%, #1A2E33 50%, var(--bg-canvas) 100%);
        }

        /* Landscape Silhouette Background Layer */
        .login-silhouette {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            opacity: 0.18;
            z-index: 1;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border-stone);
            border-radius: 28px 32px 24px 30px;
            padding: 38px 36px;
            box-shadow: 0 16px 40px rgba(47, 74, 58, 0.08);
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .demo-accounts {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid var(--border-stone);
            font-size: 0.82rem;
            color: var(--text-earth);
        }

        .demo-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-stone);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .demo-card:hover {
            border-color: var(--primary-forest);
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        .demo-user {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--text-ink);
        }

        .demo-role {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            background: var(--bg-muted);
            color: var(--primary-forest);
            font-weight: 700;
            text-transform: uppercase;
        }

        .login-theme-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 20;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- Top Corner Theme Toggle -->
    <div class="login-theme-btn">
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Night Sky Mode" title="Toggle Light / Night Sky Mode">
            <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <!-- Mountain & Forest Landscape SVG Silhouette Backdrop -->
    <div class="login-silhouette">
        <svg viewBox="0 0 1200 160" preserveAspectRatio="none" style="width: 100%; height: 160px; display: block;" fill="var(--primary-forest)">
            <path d="M0,160 L0,90 Q200,45 400,80 T800,60 T1200,75 L1200,160 Z"></path>
            <polygon points="150,90 156,60 162,90"></polygon>
            <polygon points="158,90 164,52 170,90"></polygon>
            <polygon points="340,82 345,55 350,82"></polygon>
            <polygon points="347,83 353,48 359,83"></polygon>
            <polygon points="620,70 626,42 632,70"></polygon>
            <polygon points="628,72 634,36 640,72"></polygon>
            <polygon points="880,75 886,46 892,75"></polygon>
            <polygon points="1040,80 1046,50 1052,80"></polygon>
        </svg>
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon" style="margin: 0 auto 16px auto; width: 46px; height: 46px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                </svg>
            </div>
            <h1 style="font-size: 1.85rem; font-weight: 600; margin-bottom: 4px;">Sign In to Console</h1>
            <p style="color: var(--text-earth); font-size: 0.92rem;">AQI Sentinel &bull; The Air You Breathe</p>
        </div>

        <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert-banner alert-success" th:text="${logoutMessage}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">Operator / Analyst Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (e.g. admin)" required autofocus />
            </div>

            <div class="form-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px 20px;">
                Enter Atmospheric Portal
            </button>
        </form>

        <div class="demo-accounts">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-weight: 600; color: var(--text-ink);">Quick Credentials (Click to Fill):</span>
                <span class="status-indicator" style="font-size: 0.72rem; padding: 2px 8px;"><span class="pulse-dot"></span> Ready</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="demo-card" onclick="fillCreds('admin', 'admin123')">
                    <span class="demo-user">admin</span>
                    <span class="demo-role">Admin</span>
                </div>
                <div class="demo-card" onclick="fillCreds('analyst', 'analyst123')">
                    <span class="demo-user">analyst</span>
                    <span class="demo-role">Analyst</span>
                </div>
                <div class="demo-card" onclick="fillCreds('operator', 'operator123')">
                    <span class="demo-user">operator</span>
                    <span class="demo-role">Operator</span>
                </div>
                <div class="demo-card" onclick="fillCreds('viewer', 'viewer123')">
                    <span class="demo-user">viewer</span>
                    <span class="demo-role">Viewer</span>
                </div>
            </div>
            <div style="margin-top: 16px; text-align: center; color: var(--text-muted); font-size: 0.78rem;">
                Crafted by <strong>Big Coders</strong> &bull; Group 3Q15 (Aryan Sharma, Aniket Raj, Chirag Lamba)
            </div>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('username').value = u;
        document.getElementById('password').value = p;
    }

    // Theme Toggle Handler
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('themeToggleBtn');
        const sunIcon = document.getElementById('themeIconSun');
        const moonIcon = document.getElementById('themeIconMoon');
        const currentTheme = localStorage.getItem('aqi-theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            if (sunIcon && moonIcon) {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const nextTheme = isDark ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', nextTheme);
                localStorage.setItem('aqi-theme', nextTheme);
                if (sunIcon && moonIcon) {
                    sunIcon.style.display = nextTheme === 'dark' ? 'none' : 'block';
                    moonIcon.style.display = nextTheme === 'dark' ? 'block' : 'none';
                }
            });
        }
    });
</script>

</body>
</html>
