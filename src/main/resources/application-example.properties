# AQI Monitoring & Prediction System - Example Properties
server.port=${PORT:8080}
spring.application.name=AQI Monitoring & Prediction System

# MySQL Configuration
# Replace localhost, username, and password with your MySQL details
spring.datasource.url=jdbc:mysql://localhost:3306/aqi_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Open-Meteo Weather API (No key required for non-commercial use)
openmeteo.api.base-url=https://api.open-meteo.com/v1/forecast

# OpenAQ API (Optional - add your key if you have one, or leave blank)
openaq.api.key=
openaq.api.base-url=https://api.openaq.org/v3
